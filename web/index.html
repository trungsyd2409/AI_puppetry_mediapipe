<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puppetry</title>
</head>
<body>
  <main class="app">
    <div class="stage-wrap">
      <canvas id="stage" width="1200" height="1200"></canvas>
      <div id="overlay" class="overlay">
        <div class="card">
          <h1 id="title">Puppetry</h1>
          <p>Giơ tay trước camera để nối dây và điều khiển rối. Rút tay ra khỏi khung hình thì dây đứt, rối ngã.</p>
          <div class="buttons">
            <button id="btnCamera" class="primary">Bật camera</button>
            <button id="btnMouse">Dùng chuột (test)</button>
          </div>
          <p id="status" class="status">Đang tải...</p>
          <p class="hint">Ngón giữa: đầu · ngón trỏ, áp út: hai tay · ngón cái, út: hai gối<br>Phím: C camera · M chuột · R reset</p>
        </div>
      </div>
    </div>
    <video id="video" playsinline muted></video>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
